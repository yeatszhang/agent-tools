version: 1

skills:
  - id: writing-editor
    path: skills/writing-editor
    status: active
    description: 中文去 AI 味，并通过人工修改 diff 逐步学习个人 Voice。
  - id: repo-spec-maintainer
    path: skills/repo-spec-maintainer
    status: active
    description: 创建、裁剪和审查项目级 AGENTS.md，并维护 repository policy 与 Skills 的链接边界。

agents:
  - id: research-agent
    path: agents/research-agent.md
    status: draft
    description: 面向技术/产品调研的证据优先 Agent 模板。
  - id: review-agent
    path: agents/review-agent.md
    status: draft
    description: 面向代码、方案、文档的审查 Agent 模板。

templates:
  - id: repo-spec
    path: templates/repo-spec
    status: active
    description: 默认接入 OpenSpec 的 AI-assisted coding 项目工程约束与知识地图模板。
  - id: skill
    path: templates/skill
    status: active
    description: 可复用 Skill 的按需加载、结构与评测模板。
  - id: agent-harness
    path: templates/agent-harness
    status: active
    description: Agent Runtime 与多 Agent 系统的执行、工具、隔离和评测模板。

mcp:
  catalog: mcp/catalog.yaml

tools:
  catalog: tools/catalog.yaml
