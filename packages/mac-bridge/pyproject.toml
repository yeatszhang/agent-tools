[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mac-bridge"
version = "0.1.0"
description = "让远端 MCP 客户端访问用户授权的 macOS 应用与个人知识库"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "pydantic>=2.7,<3", "uvicorn>=0.30,<1", "starlette>=0.40,<1.1"]

[project.scripts]
mac-bridge = "mac_bridge.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mac_bridge"]
