version: 1

servers:
  - id: mac-bridge
    status: active
    category: local
    purpose: 通过 MCP 访问 Mac 上的 notebook、备忘录、提醒事项和日历
    path: packages/mac-bridge
    secrets:
      - MAC_BRIDGE_TOKEN  # 仅 HTTP 模式使用
    config_committed: false

  - id: github
    status: active
    category: development
    purpose: Repository / PR / issue workflows
    secrets:
      - GITHUB_TOKEN
    config_committed: false

  - id: filesystem
    status: candidate
    category: local
    purpose: Controlled local file access
    secrets: []
    config_committed: false

  - id: browser
    status: candidate
    category: research
    purpose: Browser automation / page exploration
    secrets: []
    config_committed: false

# Add real server implementations only after validating:
# - upstream activity
# - permission scope
# - secret handling
# - usefulness in repeated workflows
